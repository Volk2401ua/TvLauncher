name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Обновлено до v5 (работает на Node 24)
      - uses: actions/checkout@v5

      # 2. Обновлено до v5 (работает на Node 24)
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Обновлено до v4 (работает на Node 24)
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 4. Заодно обновляем и загрузку артефакта, чтобы не было предупреждений в будущем
      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: TvLauncher-debug
          path: app/build/outputs/apk/debug/app-debug.apk
